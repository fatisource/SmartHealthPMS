<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12263c">
  <meta name="description" content="CarePlan healthcare project management workspace">
  <title>CarePlan | Healthcare Project Workspace</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="CarePlan dashboard">
        <span class="brand-mark">CP</span>
        <span class="brand-copy"><strong>CarePlan</strong><small>PROJECT WORKSPACE</small></span>
      </a>
      <div class="nav-caption">PROJECT DELIVERY</div>
      <nav class="navigation" aria-label="Project modules">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">⌂</span><span>Overview</span></button>
        <button class="nav-link" data-page="initiation"><span class="nav-icon">01</span><span>Initiation</span></button>
        <button class="nav-link" data-page="scope"><span class="nav-icon">02</span><span>Scope &amp; WBS</span></button>
        <button class="nav-link" data-page="schedule"><span class="nav-icon">03</span><span>Schedule</span></button>
        <button class="nav-link" data-page="cost"><span class="nav-icon">04</span><span>Cost &amp; EVM</span></button>
        <button class="nav-link" data-page="quality"><span class="nav-icon">05</span><span>Quality &amp; Risk</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-indicator"><span class="storage-dot"></span><span id="database-status">Connecting to MySQL…</span></div>
        <small>CarePlan · Smart Healthcare PMS</small>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumb"><span>Smart Healthcare</span><span class="crumb-separator">/</span><strong id="current-section">Overview</strong></div>
        <div class="top-actions">
          <span class="today-label" id="today-label"></span>
          <button class="button button-outline button-small" id="export-data">Export backup</button>
          <button class="button button-outline button-small" id="import-data">Import backup</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </header>
      <div class="page-container" id="page-container"></div>
      <footer class="app-footer">
        <span>CarePlan <span class="footer-divider">·</span> Project operations workspace</span>
        <span>Local XAMPP MySQL database · spms_db</span>
      </footer>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="record-dialog" class="record-dialog">
    <form id="record-form" method="dialog">
      <div class="dialog-header">
        <div><p class="eyebrow" id="dialog-eyebrow">PROJECT RECORD</p><h2 id="dialog-title">Add record</h2></div>
        <button type="button" class="icon-button" id="close-dialog" aria-label="Close dialog">×</button>
      </div>
      <div class="dialog-fields" id="dialog-fields"></div>
      <div class="dialog-actions">
        <button type="button" class="button button-outline" id="cancel-dialog">Cancel</button>
        <button type="submit" class="button button-primary">Save record</button>
      </div>
    </form>
  </dialog>
</body>
</html>
